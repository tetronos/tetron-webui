[package]
name = "tetron-webui"
version = "0.15.1"
edition = "2024"
rust-version = "1.91"
license = "MPL-2.0"
description = "Browser dashboard and admin console for tetron, over the daemon IPC socket"
repository = "https://github.com/tetronos/tetron-webui"

[[bin]]
name = "tetron-webui"
path = "src/main.rs"

[dependencies]
# Pinned to a tetron core release tag of this minor, not floating on main: a
# bare git dependency lets Cargo.lock freeze any commit, so suite clients
# drifted to different protocol revisions. contrib/bump-proto.sh moves the
# tag; a tetron release opens that bump as a pull request (bump-proto.yml);
# contrib/check-suite-deps.sh guards it. The wire types still use
# #[serde(default)], so binaries of the same minor keep working together.
tetron-proto = { git = "https://github.com/tetronos/tetron", tag = "v0.15.7" }
# `install`/`uninstall` subcommands for the per-user service. Same crates/
# versions tetron's own CLI uses.
clap = { version = "4", features = ["derive", "env"] }
dirs = "6.0.0"
# Needed directly for EndpointId (used decoding an invite code) -- version
# must track tetron-proto's own pin so Cargo resolves both to the same
# underlying type rather than two incompatible iroh versions.
iroh = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Decodes an invite code (bs58(network_pubkey || secret || checksum))
# client-side, same as tetron's own CLI does in src/invite.rs -- that decode
# logic lives in the main tetron crate (a binary, not meant to be depended
# on as a library), so it's reimplemented here rather than pulled in.
bs58 = "0.5"
# Verifies the trailing 4-byte checksum on a decoded invite code
# (INVITE-CHECKSUM-001) -- same crate/major version as tetron core's own
# Cargo.toml, no `serde` feature needed here (nothing in this crate
# serializes a blake3 hash, unlike core's InviteEntry/ReusableKey).
blake3 = "1"
# Addon-install framework (src/addons.rs): a private per-install scratch dir
# for the download+verify step. tetron core keeps this dev-only to preserve
# its own minimal-deps posture, but that constraint doesn't apply to webui.
tempfile = "3"
